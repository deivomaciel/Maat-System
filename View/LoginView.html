<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Maat</title>
    <link rel="stylesheet" href="/Static/home.css">
    <link rel="stylesheet" href="/Static/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

    <!-- NAV -->
    <header class="nav">
        <div class="nav__inner">
            <a href="/" class="nav__logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="#4F46E5"/>
                    <path d="M7 14c0-3.866 3.134-7 7-7s7 3.134 7 7-3.134 7-7 7-7-3.134-7-7z" fill="white" opacity=".3"/>
                    <path d="M11 14l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MaatS</span>
            </a>
            <div class="nav__actions">
                <span class="nav__hint">Ainda não tem conta?</span>
                <a href="/register" class="btn btn--primary">Criar conta</a>
            </div>
        </div>
    </header>

    <!-- AUTH LAYOUT -->
    <main class="auth-layout">
        <div class="auth-bg">
            <div class="auth-blob auth-blob--1"></div>
            <div class="auth-blob auth-blob--2"></div>
        </div>

        <div class="auth-card">
            <div class="auth-card__header">
                <div class="auth-card__icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect width="28" height="28" rx="8" fill="#4F46E5"/>
                        <path d="M7 14c0-3.866 3.134-7 7-7s7 3.134 7 7-3.134 7-7 7-7-3.134-7-7z" fill="white" opacity=".3"/>
                        <path d="M11 14l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="auth-card__title">Bem-vindo de volta</h1>
                <p class="auth-card__subtitle">Entre com seu e-mail e senha para continuar.</p>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group" id="emailGroup">
                    <label class="form-label" for="email">E-mail</label>
                    <div class="form-input-wrap">
                        <svg class="form-input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <rect x="2" y="4" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M2 7l7 4 7-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input
                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group" id="passwordGroup">
                    <label class="form-label" for="password">Senha</label>
                    <div class="form-input-wrap">
                        <svg class="form-input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <rect x="3" y="8" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M6 8V6a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <input
                            class="form-input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="form-input-toggle" id="togglePassword" aria-label="Mostrar senha">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.5"/>
                                <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <div class="form-alert" id="formAlert" style="display:none"></div>

                <button type="submit" class="btn btn--primary btn--lg btn--full" id="submitBtn">
                    <span id="submitText">Entrar</span>
                    <svg id="submitSpinner" class="spinner" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none">
                        <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="2" stroke-dasharray="22 22" stroke-linecap="round"/>
                    </svg>
                </button>
            </form>

            <div class="auth-card__footer">
                Ainda não tem conta?
                <a href="/register" class="auth-link">Criar conta grátis</a>
            </div>
        </div>
    </main>

    <script>
        // Show/hide password
        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('password');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            document.getElementById('eyeIcon').innerHTML = isHidden
                ? '<path d="M2 2l14 14M7.5 7.7A2.5 2.5 0 0111.3 11M5.3 5.4C3.3 6.8 2 9 2 9s3 5 7 5a7 7 0 003.7-1.1M9 4c4 0 7 5 7 5s-.7 1.3-2 2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
                : '<path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/>';
        });

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            document.getElementById('submitText').style.display = loading ? 'none' : 'inline';
            document.getElementById('submitSpinner').style.display = loading ? 'block' : 'none';
            btn.disabled = loading;
        }

        function setFieldError(field, msg) {
            const group = document.getElementById(field + 'Group');
            const error = document.getElementById(field + 'Error');
            group.classList.toggle('form-group--error', !!msg);
            error.textContent = msg || '';
        }

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('formAlert');
            el.textContent = msg;
            el.className = 'form-alert form-alert--' + type;
            el.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('formAlert').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideAlert();
            setFieldError('email', '');
            setFieldError('password', '');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let valid = true;

            if (!email) { setFieldError('email', 'Informe seu e-mail.'); valid = false; }
            if (!password) { setFieldError('password', 'Informe sua senha.'); valid = false; }
            if (!valid) return;

            setLoading(true);
            try {
                const res = await fetch('/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                
                if (!res.ok) {
                    let serverMessage = data.detail[0]?.type || null

                    serverMessage = serverMessage == 'string_too_short' ? 'A senha dever possuir no mínimo 6 dígitos' : serverMessage

                    showAlert(serverMessage || 'E-mail ou senha inválidos.');
                    return;
                }

                localStorage.setItem('maat_user', JSON.stringify({ id: data.id, name: data.name, email: data.email }));
                window.location.href = '/dashboard';
            } catch {
                showAlert('Erro de conexão. Tente novamente.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
